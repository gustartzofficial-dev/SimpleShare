name = "simpleshare"
main = "src/profile-worker.js"
compatibility_date = "2026-08-18"

[vars]
MONTHLY_EGRESS_CAP_GB = "900"
# Set your exact frontend origin(s), comma-separated, before production use.
# ALLOWED_ORIGINS = "https://your-app.vercel.app"
# Public fallback relay is opt-in for Cloudflare rooms; prefer your own TURN.
FALLBACK_TURN_DISABLED = "1"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomHub"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetTracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BudgetTracker"]

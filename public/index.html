<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>SimpleShare</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- landing -->
  <main id="home" class="home hidden">
    <div class="home-inner">
      <h1>SimpleShare</h1>
      <p>Share a screen with friends. No accounts, no chat, no calls.</p>
      <button id="createBtn" class="primary big">Create a room</button>
      <small>You'll get a link to send to whoever you want.</small>
    </div>
  </main>

  <!-- room -->
  <main id="room" class="room hidden">
    <header class="bar">
      <div class="bar-left">
        <strong>SimpleShare</strong>
        <span id="status" class="status">Connecting</span>
      </div>
      <div class="bar-right">
        <input id="myName" class="name-input" maxlength="28" aria-label="Your name" />
        <button id="membersBtn" class="ghost">Hide members</button>
        <button id="leaveBtn" class="ghost">Leave</button>
      </div>
    </header>

    <section class="controls">
      <div class="invite">
        <input id="inviteLink" readonly aria-label="Invite link" />
        <button id="copyBtn" class="primary">Copy link</button>
      </div>
      <select id="quality" aria-label="Quality">
        <option value="720p30">720p 30fps</option>
        <option value="720p60">720p 60fps</option>
        <option value="1080p60">1080p 60fps</option>
      </select>
      <select id="contentHint" aria-label="Content type">
        <option value="motion">Motion (games, video)</option>
        <option value="detail">Detail (code, docs)</option>
      </select>
      <label class="check"><input type="checkbox" id="withAudio" /> Include audio</label>
      <button id="shareBtn" class="primary" disabled>Share my screen</button>
      <button id="stopBtn" class="danger hidden">Stop sharing</button>
      <button id="unmuteBtn" class="ghost hidden">Unmute audio</button>
    </section>

    <section class="stage">
      <div id="empty" class="empty">
        <p>Nobody is sharing yet.</p>
        <small>Anyone in the room can share, and several people can share at once.</small>
      </div>
      <div id="grid" class="grid hidden"></div>
    </section>

    <aside class="people-panel">
      <h2>In this room (<span id="peopleCount">0</span>)</h2>
      <div id="people" class="people"></div>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <!-- activity log: nothing fails silently anymore -->
  <div id="logPanel" class="log-panel">
    <button id="logToggle" class="log-toggle">Activity log</button>
    <div id="logBody" class="log-body"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
